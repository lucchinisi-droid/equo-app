<div class="modal-overlay" id="modal-completa-profilo">
  <div class="modal">
    <div class="modal-title">Completa il tuo profilo</div>
    <p style="margin:0 0 14px;color:var(--muted);font-size:13.5px">Per il corretto funzionamento dell'app, e per farti riconoscere e connettere con amici e centri ippici, è indispensabile inserire il tuo nome e cognome corretti.</p>
    <div class="field">
      <label>Nome e cognome</label>
      <input class="input" id="cp-nome-cognome" placeholder="Es. Mario Rossi">
    </div>
    <div class="auth-error" id="cp-nome-error" style="display:none"></div>
    <button class="btn btn-primary btn-block" onclick="saveCompleteProfile()">Salva e continua</button>
  </div>
</div>
