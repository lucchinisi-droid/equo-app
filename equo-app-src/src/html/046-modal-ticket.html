<div class="modal-overlay" id="modal-ticket" onclick="closeOut(event,'modal-ticket')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="tk-form">
      <div class="modal-title"><span class="fa-icon"><i class="fa-solid fa-life-ring"></i></span>Apri un ticket</div>
      <div class="muted" style="font-size:13px;margin-bottom:14px;line-height:1.5">Raccontaci cosa succede: il team Equo ti risponde via email. Per dubbi veloci su come si usa l'app puoi chiedere anche al tuo assistente AI.</div>
      <div class="auth-form" style="max-width:none">
        <div class="input-group"><label class="input-label">Di cosa si tratta?</label>
          <select class="input" id="tk-categoria">
            <option value="problema">Problema / errore</option>
            <option value="domanda">Domanda sull'uso dell'app</option>
            <option value="account">Account e accesso</option>
            <option value="pagamenti">Abbonamento e pagamenti</option>
            <option value="suggerimento">Suggerimento</option>
            <option value="altro">Altro</option>
          </select></div>
        <div class="input-group"><label class="input-label">Oggetto</label><input class="input" id="tk-oggetto" maxlength="120" placeholder="es. Non riesco a collegare il maniscalco"></div>
        <div class="input-group"><label class="input-label">Descrizione</label><textarea class="input" id="tk-descrizione" rows="5" maxlength="4000" placeholder="Cosa stavi facendo, cosa ti aspettavi e cosa è successo (eventuale messaggio di errore)"></textarea></div>
        <div class="input-group"><label class="input-label">Email per la risposta</label><input class="input" id="tk-email" type="email" maxlength="160"></div>
        <div class="input-group"><label class="input-label">Telefono (facoltativo)</label><input class="input" id="tk-telefono" type="tel" maxlength="40" placeholder="+39 …"></div>
        <div class="auth-error" id="tk-error" style="display:none"></div>
        <button class="btn btn-primary" id="tk-btn" onclick="inviaTicketAssistenza()" style="width:100%;margin-top:4px">Invia ticket</button>
      </div>
    </div>
    <div id="tk-ok" class="richiesta-ok" style="display:none">
      <div class="emoji">🛟</div>
      <div class="section-title" style="margin-bottom:6px" id="tk-ok-titolo">Ticket inviato</div>
      <div class="muted" style="font-size:13.5px;line-height:1.6;margin-bottom:16px">Ti abbiamo mandato una email di conferma: la risposta del team arriverà allo stesso indirizzo.</div>
      <button class="btn btn-primary" style="width:100%" onclick="closeModal('modal-ticket')">Ok</button>
    </div>
  </div>
</div>
