<div class="modal-overlay" id="modal-add-lezione" onclick="closeOut(event,'modal-add-lezione')">
  <div class="modal">
    <button class="modal-close-x" onclick="closeModal('modal-add-lezione')" aria-label="Chiudi"><span class="fa-icon"><i class="fa-solid fa-xmark"></i></span></button>
    <div class="modal-handle"></div>
    <div class="modal-title"><span class="icon"><svg><use href="#i-calendar"/></svg></span><span id="lezione-form-title">Nuova lezione</span></div>
    <div class="auth-form">
      <div class="input-group">
        <label class="input-label">Cavallo</label>
        <select class="input" id="lezione-cavallo"></select>
      </div>
      <div class="input-group">
        <label class="input-label">Tipo</label>
        <select class="input" id="lezione-tipo">
          <option value="lezione">Lezione</option>
          <option value="allenamento">Allenamento libero</option>
          <option value="gara">Gara</option>
          <option value="altro">Altro</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">Data</label>
        <input class="input" id="lezione-data" type="date">
      </div>
      <div class="input-group">
        <label class="input-label">Note (opzionale)</label>
        <input class="input" id="lezione-note" placeholder="es. con l'istruttore Luca">
      </div>
      <div class="auth-error" id="lezione-error" style="display:none"></div>
      <button class="btn btn-primary" onclick="createLezione()" style="width:100%;margin-top:6px">Salva lezione</button>
      <button class="btn btn-ghost" id="lezione-delete-btn" style="width:100%;margin-top:6px;color:var(--red);display:none" onclick="deleteLezioneCorrente()">Elimina lezione</button>
    </div>
  </div>
</div>
