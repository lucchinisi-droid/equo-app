<div class="modal-overlay" id="modal-lascia-cavallo" onclick="closeOut(event,'modal-lascia-cavallo')">
  <div class="modal">
    <button class="modal-close-x" onclick="closeModal('modal-lascia-cavallo')" aria-label="Chiudi"><span class="fa-icon"><i class="fa-solid fa-xmark"></i></span></button>
    <div class="modal-handle"></div>
    <div class="modal-title" id="lc-tit">Non lo seguo più</div>
    <div class="muted" id="lc-testo" style="font-size:13px;line-height:1.55;margin-bottom:12px"></div>
    <div id="lc-motivo-box">
      <label class="input-label" for="lc-motivo">Motivo (facoltativo)</label>
      <input class="input" id="lc-motivo" maxlength="300" placeholder="Es. il proprietario ha cambiato maniscalco" style="margin-bottom:12px">
    </div>
    <button class="btn btn-primary" id="lc-ok" style="width:100%" onclick="confermaLasciaCavallo()">Invia la richiesta</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:6px" onclick="closeModal('modal-lascia-cavallo')">Annulla</button>
  </div>
</div>
