<div class="modal-overlay" id="modal-cambia-proprietario" onclick="closeOut(event,'modal-cambia-proprietario')">
  <div class="modal">
    <button class="modal-close-x" onclick="closeModal('modal-cambia-proprietario')" aria-label="Chiudi"><span class="fa-icon"><i class="fa-solid fa-xmark"></i></span></button>
    <div class="modal-handle"></div>
    <div class="modal-title"><span class="fa-icon"><i class="fa-solid fa-user"></i></span><span id="cp-tit">Cambia proprietario</span></div>
    <div class="muted" id="cp-nota" style="font-size:12.5px;line-height:1.55;margin-bottom:10px"></div>
    <div id="cp-cavalli" class="cp-cavalli" hidden></div>
    <label class="input-label" for="cp-dest">Nuovo proprietario (chi paga)</label>
    <select class="input" id="cp-dest" onchange="cpDestCambiata(this)"></select>
    <div id="cp-nuovo" class="cp-nuovo" hidden>
      <input class="input" id="cp-nuovo-nome" maxlength="80" placeholder="Nome e cognome del proprietario">
      <input class="input" id="cp-nuovo-tel" type="tel" maxlength="30" placeholder="Telefono (opzionale)">
    </div>
    <div id="cp-aperti" class="cp-aperti solo-incassi" hidden></div>
    <div class="auth-error" id="cp-errore" style="display:none"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="confermaCambiaProprietario(this)">Conferma</button>
  </div>
</div>
