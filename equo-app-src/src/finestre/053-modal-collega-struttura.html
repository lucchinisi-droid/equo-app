<div class="modal-overlay" id="modal-collega-struttura" onclick="closeOut(event,'modal-collega-struttura')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><span class="fa-icon"><i class="fa-solid fa-building"></i></span>Collega una scuderia</div>
    <div class="muted" style="font-size:13px;margin-bottom:14px;line-height:1.5">
      Inserisci il <strong>codice della scuderia</strong> (lo trova in Equo Scuderia → Il tuo Centro → Codice invito). La scuderia riceve la richiesta e la conferma.
    </div>
    <div class="auth-form">
      <div class="input-group">
        <label class="input-label">Codice della scuderia</label>
        <input class="input" id="collega-struttura-codice" placeholder="es. EQUO3F8A2" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')inviaRichiestaStruttura()">
      </div>
      <div class="auth-error" id="collega-struttura-error" style="display:none"></div>
      <button class="btn btn-primary" onclick="inviaRichiestaStruttura()" style="width:100%;margin-top:6px">Invia richiesta</button>
    </div>
  </div>
</div>
