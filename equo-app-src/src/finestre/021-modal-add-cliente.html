<div class="modal-overlay" id="modal-add-cliente" onclick="closeOut(event,'modal-add-cliente')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><span class="fa-icon"><i class="fa-solid fa-users"></i></span>Nuovo cliente</div>
    <div class="auth-form">
      <div class="input-group">
        <label class="input-label">Tipo di cliente</label>
        <select class="input" id="cliente-tipo" onchange="aggiornaEtichetteNuovoCliente()">
          <option value="proprietario">Proprietario</option>
          <option value="struttura">Scuderia o centro ippico</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label" id="cliente-nome-label">Nome cliente</label>
        <input class="input" id="cliente-nome" placeholder="es. Marco Bianchi">
      </div>
      <div class="input-group">
        <label class="input-label">Cavalli (opzionale)</label>
        <input class="input" id="cliente-cavallo" placeholder="es. Aurora, Baia (separati da virgola)">
      </div>
      <div class="input-group">
        <label class="input-label">Telefono (opzionale)</label>
        <input class="input" id="cliente-telefono" placeholder="es. 333 1234567">
      </div>
      <div class="input-group">
        <label class="input-label">Indirizzo (opzionale, per «Naviga»)</label>
        <input class="input" id="cliente-indirizzo" autocomplete="street-address" placeholder="es. Via Casilina km 51, Colleferro">
        <button type="button" class="pos-link" onclick="usaPosizioneQui('cliente-indirizzo', this)">📍 Usa la mia posizione attuale</button><div class="pos-nota" id="cliente-indirizzo-pos-nota"></div>
      </div>
      <div class="input-group">
        <label class="input-label">Note (opzionale)</label>
        <input class="input" id="cliente-note" placeholder="es. scuderia, indicazioni">
      </div>
      <div class="input-group" id="cliente-codice-group">
        <label class="input-label">Codice Equo del cliente (opzionale)</label>
        <input class="input" id="cliente-codice-equo" placeholder="es. EQUOOWN3Q9NM" style="text-transform:uppercase" autocapitalize="characters">
        <div class="muted" style="font-size:11.5px;line-height:1.5;margin-top:4px">Il cliente lo trova in Equo App → menu profilo → "Il tuo codice per la chat". Così puoi scrivergli tu per primo.</div>
      </div>
      <div class="auth-error" id="cliente-error" style="display:none"></div>
      <button class="btn btn-primary" id="cliente-save-btn" onclick="createClienteMascalcia()" style="width:100%;margin-top:6px">Salva cliente</button>
    </div>
  </div>
</div>
