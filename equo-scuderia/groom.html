<style>
:root{ --verde:#0b341e; --verde2:#1d4a35; --sfondo:#f3f1ea; --card:#fff; --testo:#1b241f; --muted:#6b746e; --bordo:#e2ddd0; --rosso:#c0392b; --giallo:#e0a526; --ok:#2e8b57; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--sfondo); color:var(--testo); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari","Noto Sans Gurmukhi","Noto Sans Arabic",Arial,sans-serif; }
body{ min-height:100vh; padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
button{ font:inherit; color:inherit; cursor:pointer; }
.hidden{ display:none !important; }

/* testata */
.top{ position:sticky; top:0; z-index:20; background:var(--verde); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; }
.top-riga{ display:flex; align-items:center; gap:10px; }
.top img{ width:34px; height:34px; border-radius:9px; background:#fff; }
.top .tit{ flex:1; min-width:0; }
.top .tit b{ display:block; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .tit span{ font-size:12.5px; opacity:.8; }
.top .ib{ width:42px; height:42px; border-radius:12px; border:0; background:rgba(255,255,255,.12); color:#fff; font-size:18px; display:grid; place-items:center; }
.prog{ margin-top:10px; height:8px; border-radius:6px; background:rgba(255,255,255,.18); overflow:hidden; }
.prog i{ display:block; height:100%; background:#8fd19e; border-radius:6px; width:0; transition:width .3s; }
.prog-txt{ display:flex; justify-content:space-between; font-size:12.5px; margin-top:5px; opacity:.9; }

.banner{ margin:10px 12px 0; padding:10px 12px; border-radius:12px; font-size:14px; display:flex; gap:10px; align-items:center; }
.banner.off{ background:#fff4d6; color:#7a5300; border:1px solid #f0d78a; }
.banner.inst{ background:#e8f3ec; color:var(--verde); border:1px solid #bfdcc9; }
.banner.inst button{ margin-inline-start:auto; border:0; background:var(--verde); color:#fff; border-radius:10px; padding:8px 12px; font-weight:600; }

.filtri{ display:flex; gap:8px; padding:12px 12px 0; }
.filtri button{ flex:1; border:1px solid var(--bordo); background:#fff; border-radius:12px; padding:11px 8px; font-weight:600; font-size:15px; }
.filtri button.on{ background:var(--verde2); color:#fff; border-color:var(--verde2); }
.focus-bar{ display:flex; align-items:center; gap:10px; margin:12px 12px 0; }
.focus-bar button{ border:0; background:var(--verde2); color:#fff; border-radius:12px; padding:12px 14px; font-weight:600; font-size:15px; }

.lista{ padding:12px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
.box{ background:var(--card); border-radius:18px; border:2px solid var(--bordo); overflow:hidden; scroll-margin-top:120px; }
.box.evid{ border-color:var(--giallo); box-shadow:0 0 0 3px rgba(224,165,38,.35); }
.box.finito{ border-color:#9fd2ae; }
.box-h{ display:flex; align-items:center; gap:10px; padding:12px 14px 8px; }
.box-num{ min-width:52px; height:52px; border-radius:14px; background:var(--verde); color:#fff; display:grid; place-items:center; font-weight:800; font-size:21px; padding:0 6px; }
.box-num small{ display:block; font-size:9.5px; font-weight:600; opacity:.75; line-height:1; margin-bottom:-6px; }
.box-cav{ flex:1; min-width:0; }
.box-cav b{ display:block; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.box-cav span{ font-size:13px; color:var(--muted); }
.nota-btn{ width:44px; height:44px; border-radius:50%; border:0; background:var(--rosso); color:#fff; font-weight:800; font-size:19px; flex:none; }
.box-stato{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; background:#eef2ee; color:var(--verde2); border-radius:20px; padding:3px 9px; margin-top:3px; }
.icone{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:6px 12px 14px; }
.ic{ border:2px solid var(--bordo); background:#faf9f5; border-radius:14px; min-height:84px; padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; position:relative; }
.ic .g{ font-size:27px; line-height:1; height:30px; display:grid; place-items:center; color:var(--c); }
.ic .g svg{ width:28px; height:28px; }
.ic .n{ font-size:11.5px; line-height:1.15; text-align:center; font-weight:600; color:var(--testo); word-break:break-word; }
.ic .chi{ font-size:10.5px; line-height:1.1; color:#fff; opacity:.95; text-align:center; }
.ic.fatto{ background:var(--c); border-color:var(--c); }
.ic.fatto .g, .ic.fatto .n{ color:#fff; }
.ic.fatto::after{ content:"\f00c"; font-family:"Font Awesome 6 Free"; font-weight:900; position:absolute; top:5px; inset-inline-end:6px; font-size:12px; color:#fff; }
.ic.attesa{ outline:2px dashed var(--giallo); outline-offset:2px; }
.ic:active{ transform:scale(.96); }
.box-vuoto{ padding:4px 14px 16px; color:var(--muted); font-size:15px; display:flex; align-items:center; gap:8px; }
.box.manut{ background:#fff; border-color:#cfd6d9; }

.fab{ position:fixed; z-index:30; bottom:calc(18px + env(safe-area-inset-bottom)); inset-inline-end:18px; border:0; border-radius:30px; background:var(--verde); color:#fff; font-weight:700; font-size:17px; padding:16px 22px; display:flex; gap:10px; align-items:center; box-shadow:0 6px 18px rgba(0,0,0,.25); }
.fab i{ font-size:22px; }

/* schermate di accesso */
.schermo{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 22px; text-align:center; gap:14px; background:var(--verde); color:#fff; }
.schermo img{ width:76px; height:76px; border-radius:20px; background:#fff; }
.schermo h1{ margin:0; font-size:24px; }
.schermo p{ margin:0; opacity:.88; font-size:16px; max-width:360px; line-height:1.4; }
.pin-punti{ display:flex; gap:14px; margin:6px 0; direction:ltr; }
.pin-punti i{ width:18px; height:18px; border-radius:50%; border:2px solid #fff; }
.pin-punti i.on{ background:#fff; }
.tast{ display:grid; grid-template-columns:repeat(3,78px); gap:12px; direction:ltr; }
.tast button{ height:68px; border-radius:18px; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:26px; font-weight:600; }
.tast button:active{ background:rgba(255,255,255,.3); }
.err{ color:#ffd2cc; font-weight:600; min-height:22px; font-size:15px; }
.btn-chiaro{ border:0; background:#fff; color:var(--verde); border-radius:14px; padding:14px 20px; font-weight:700; font-size:16px; display:inline-flex; gap:10px; align-items:center; }
.lnk{ border:0; background:none; color:#fff; opacity:.85; text-decoration:underline; font-size:14px; }

/* fogli */
.velo{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.foglio{ background:#fff; width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); }
.foglio h3{ margin:0 0 8px; font-size:19px; display:flex; gap:10px; align-items:center; }
.foglio p{ margin:0 0 14px; color:var(--muted); font-size:15.5px; line-height:1.4; }
.foglio .nota-testo{ background:#fdeceb; border:1px solid #f3c4bf; color:#5c1a13; border-radius:12px; padding:12px; font-size:17px; line-height:1.4; white-space:pre-wrap; }
.foglio .azioni{ display:flex; gap:10px; margin-top:14px; }
.foglio .azioni button{ flex:1; border-radius:14px; padding:15px; font-weight:700; font-size:16px; border:1px solid var(--bordo); background:#fff; }
.foglio .azioni .pri{ background:var(--rosso); border-color:var(--rosso); color:#fff; }
.foglio .azioni .ver{ background:var(--verde); border-color:var(--verde); color:#fff; }
.lingue{ display:grid; gap:8px; }
.lingue button{ border:1px solid var(--bordo); background:#fff; border-radius:14px; padding:14px; font-size:18px; text-align:start; display:flex; justify-content:space-between; align-items:center; }
.lingue button.on{ border-color:var(--verde2); background:#eef5f0; font-weight:700; }
.scan-wrap{ position:relative; border-radius:16px; overflow:hidden; background:#000; aspect-ratio:1; }
.scan-wrap video{ width:100%; height:100%; object-fit:cover; }
.scan-wrap .mirino{ position:absolute; inset:18%; border:3px solid #fff; border-radius:18px; }
.toast{ position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); background:#1b241f; color:#fff; padding:12px 16px; border-radius:12px; font-size:15px; max-width:90vw; text-align:center; }
.vuota{ text-align:center; color:var(--muted); padding:40px 20px; font-size:16px; }
</style>
</head>

/* ---------- stato ---------- */
const qs = new URLSearchParams(location.search);
const DEMO = qs.has("demo");
const leggi = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
const scrivi = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let S = DEMO ? { t:"demo", pin:"0000", lang: qs.get("lang") || "it" } : leggi(K_STATO, {});
let coda = DEMO ? [] : leggi(K_CODA, []);
let dati = DEMO ? null : leggi(K_CACHE, null);
let filtro = "tutti", focusBox = qs.get("b") || null, ultimoAgg = null, timerPoll = null, pinIns = "", pinPrimo = null, installEvt = null;
if(qs.get("t")){ if(qs.get("t") !== S.t){ S = { t: qs.get("t"), lang: S.lang }; dati = null; coda = []; scrivi(K_CODA, coda); scrivi(K_CACHE, null); } scrivi(K_STATO, S); }

const L = () => T[S.lang] || T.it;
const tr = (k, v = {}) => String(L()[k] ?? T.it[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const oraAdesso = () => new Date().toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" });
const oggiRoma = () => new Date().toLocaleDateString("sv-SE", { timeZone:"Europe/Rome" });
function applicaLingua(){ document.documentElement.lang = S.lang || "it"; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr"; }
function toast(m){ const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ---------- chiamate ---------- */
async function rpc(nome, args){
  if(DEMO) return demoRpc(nome, args);
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${nome}`, { method:"POST", headers:{ "Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + SB_KEY }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if(!r.ok){ const e = new Error(j?.message || ("HTTP " + r.status)); e.server = true; throw e; }
  return j;
}

/* ---------- avvio ---------- */
async function avvio(){
  applicaLingua();
  if(!S.t) return schermoBenvenuto();
  if(S.pin && dati){ disegna(); aggiorna(); return; }
  try{
    const info = await rpc("groom_info", { p_token: S.t });
    if(!info?.valido) return schermoMsg("non_valido", true);
    if(!S.langScelta && info.lingua){ S.lang = info.lingua; scrivi(K_STATO, S); applicaLingua(); }
    S.nome = info.nome; S.centro = info.centro;
    if(info.bloccato) return schermoMsg("bloccato", true);
    if(info.pin_da_creare){ S.pin = null; return schermoPin("crea"); }
    if(!S.pin) return schermoPin("entra");
    await aggiorna(true);
  } catch(e){
    if(S.pin && dati){ disegna(); return; }
    schermoMsg("errore", false); setTimeout(avvio, 8000);
  }
}

/* ---------- schermate di accesso ---------- */
const LOGO = `<img src="/assets/icona-equo.png" alt="">`;
function schermoBenvenuto(){
  document.getElementById("app").innerHTML = `<div class="schermo">${LOGO}<h1>${tr("app")}</h1><p>${tr("benvenuto")}</p><i class="fa-solid fa-qrcode" style="font-size:70px;opacity:.9;margin:10px 0"></i>${btnLinguaHtml()}</div>`;
}
function btnLinguaHtml(){ return `<button class="lnk" onclick="apriLingue()"><i class="fa-solid fa-language"></i> ${LINGUE[S.lang] || "Italiano"}</button>`; }
function schermoMsg(k, esci){
  document.getElementById("app").innerHTML = `<div class="schermo">${LOGO}<h1>${tr("app")}</h1><p>${tr(k)}</p>${esci ? `<i class="fa-solid fa-circle-exclamation" style="font-size:46px;opacity:.85"></i>` : `<i class="fa-solid fa-wifi" style="font-size:46px;opacity:.85"></i>`}${btnLinguaHtml()}</div>`;
}
function schermoPin(modo, errore){
  pinIns = "";
  const titolo = modo === "crea" ? (pinPrimo ? tr("ripeti_pin") : tr("crea_pin")) : tr("inserisci_pin");
  const tasti = [1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k => k === "" ? `<span></span>` : `<button onclick="tastoPin('${k}','${modo}')">${k}</button>`).join("");
  document.getElementById("app").innerHTML = `<div class="schermo">${LOGO}<h1>${esc(tr("ciao", { n: S.nome || "" }))}</h1>
    <p>${esc(S.centro || "")}</p><p style="font-weight:700;font-size:18px;opacity:1">${titolo}</p>
    <div class="pin-punti" id="pin-punti">${"<i></i>".repeat(4)}</div><div class="err" id="pin-err">${errore ? esc(errore) : ""}</div>
    <div class="tast">${tasti}</div>${btnLinguaHtml()}</div>`;
}
let pinInVerifica = false;
async function tastoPin(k, modo){
  if(pinInVerifica) return;
  if(k === "⌫") pinIns = pinIns.slice(0, -1); else if(pinIns.length < 4) pinIns += k;
  document.querySelectorAll("#pin-punti i").forEach((p, i) => p.classList.toggle("on", i < pinIns.length));
  if(pinIns.length < 4) return;
  const pin = pinIns; pinIns = "";
  if(modo === "crea" && !pinPrimo){ pinPrimo = pin; return schermoPin("crea"); }
  if(modo === "crea" && pinPrimo !== pin){ pinPrimo = null; return schermoPin("crea", tr("pin_diversi")); }
  pinPrimo = null;
  pinInVerifica = true;
  try{
    const r = await rpc("groom_stalla", { p_token: S.t, p_pin: pin });
    if(r?.errore){ return schermoPin("entra", tr("pin_errato")); }
    S.pin = pin; scrivi(K_STATO, S); ricevi(r); avviaPoll();
  } catch(e){
    if(/BLOCCATO/.test(e.message)) return schermoMsg("bloccato", true);
    if(/NON_VALIDO/.test(e.message)) return schermoMsg("non_valido", true);
    schermoPin(modo === "crea" ? "crea" : "entra", tr("errore"));
  } finally { pinInVerifica = false; }
}

/* ---------- dati e sincronizzazione ---------- */
function ricevi(r){
  dati = r; ultimoAgg = oraAdesso();
  if(r.groom) S.nome = r.groom; if(r.centro) S.centro = r.centro;
  if(!DEMO){ scrivi(K_CACHE, dati); scrivi(K_STATO, S); }
  disegna();
}
async function aggiorna(primaVolta){
  await svuotaCoda();
  if(coda.length && !primaVolta) return disegna();
  try{
    const r = await rpc("groom_stalla", { p_token: S.t, p_pin: S.pin });
    if(r?.errore){ S.pin = null; scrivi(K_STATO, S); return schermoPin("entra", tr("pin_errato")); }
    ricevi(r); avviaPoll();
  } catch(e){
    if(/NON_VALIDO/.test(e.message)){ esciDavvero(true); return schermoMsg("non_valido", true); }
    if(/BLOCCATO/.test(e.message)) return schermoMsg("bloccato", true);
    if(dati) disegna(); else if(primaVolta) throw e;
  }
}
function avviaPoll(){ if(timerPoll) return; timerPoll = setInterval(() => { if(document.visibilityState === "visible" && !document.querySelector(".velo")) aggiorna(); }, 60000); }
// un solo invio alla volta: due invii in parallelo toglievano dalla coda spunte mai spedite
let codaInVolo = null;
function svuotaCoda(){ if(!codaInVolo) codaInVolo = inviaCoda().finally(() => { codaInVolo = null; }); return codaInVolo; }
function togliDallaCoda(x){ const i = coda.indexOf(x); if(i >= 0){ coda.splice(i, 1); scrivi(K_CODA, coda); } }
async function inviaCoda(){
  while(coda.length){
    const x = coda[0];
    let r;
    try{ r = await rpc("groom_segna", { p_token: S.t, p_pin: S.pin, p_box: x.box, p_tipo: x.tipo, p_fatto: x.fatto, p_quando: x.quando }); }
    catch(e){ if(e.server && !/NON_VALIDO|BLOCCATO/.test(e.message)){ togliDallaCoda(x); continue; } return; }
    if(r?.errore === "GROOM_PIN_ERRATO"){ S.pin = null; scrivi(K_STATO, S); schermoPin("entra", tr("pin_errato")); return; }
    if(r?.errore) toast(tr("errore"));
    togliDallaCoda(x);
  }
}
window.addEventListener("online", () => aggiorna());
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.pin && dati) aggiorna(); });

/* ---------- vista box ---------- */
function iconeAttive(){ const ex = dati?.icone_extra || []; return Object.keys(ICONE).filter(k => !ICONE[k].extra || ex.includes(k)); }
function fattaIn(b, tipo){ return (b.fatte || []).find(a => a.tipo === tipo); }
function inAttesa(b, tipo){ return coda.some(x => x.box === b.id && x.tipo === tipo); }
function glifo(icona){ return icona === "svg" ? FERRO : `<i class="fa-solid ${icona}"></i>`; }
function disegna(){
  if(!dati) return;
  if(dati.oggi && dati.oggi !== oggiRoma()){ dati.box.forEach(b => b.fatte = []); }
  const ico = iconeAttive();
  const conCav = dati.box.filter(b => b.cavallo && !b.manutenzione);
  const tot = conCav.length * ico.length, fatte = conCav.reduce((s, b) => s + ico.filter(k => fattaIn(b, k)).length, 0);
  let lista = dati.box;
  if(focusBox) lista = lista.filter(b => b.id === focusBox);
  else if(filtro === "da_fare") lista = lista.filter(b => b.cavallo && !b.manutenzione && ico.some(k => !fattaIn(b, k)));
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone;
  const installato = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  document.getElementById("app").innerHTML = `
  <div class="top"><div class="top-riga"><img src="/assets/icona-equo.png" alt="">
    <div class="tit"><b>${esc(dati.centro || "")}</b><span>${esc(dati.groom || "")} · ${tr("oggi")}</span></div>
    <button class="ib" onclick="apriLingue()" aria-label="${tr("lingua")}"><i class="fa-solid fa-language"></i></button>
    <button class="ib" onclick="apriMenu()" aria-label="${tr("esci")}"><i class="fa-solid fa-ellipsis-vertical"></i></button></div>
    <div class="prog"><i style="width:${tot ? Math.round(fatte / tot * 100) : 0}%"></i></div>
    <div class="prog-txt"><span>${tr("fatti", { a: fatte, b: tot })}</span><span>${ultimoAgg ? tr("aggiornato", { o: ultimoAgg }) : ""}</span></div></div>
  ${coda.length ? `<div class="banner off"><i class="fa-solid fa-wifi"></i><span>${tr("offline", { n: coda.length })}</span></div>` : ""}
  ${!installato && !DEMO && (installEvt || isIos) ? `<div class="banner inst"><i class="fa-solid fa-mobile-screen"></i><span>${installEvt ? tr("installa") : tr("installa_ios")}</span>${installEvt ? `<button onclick="installa()">${tr("installa_btn")}</button>` : ""}</div>` : ""}
  ${focusBox ? `<div class="focus-bar"><button onclick="focusBox=null;disegna()"><i class="fa-solid fa-table-cells-large"></i> ${tr("tutti_box")}</button></div>`
    : `<div class="filtri"><button class="${filtro === "tutti" ? "on" : ""}" onclick="filtro='tutti';disegna()">${tr("tutti")}</button><button class="${filtro === "da_fare" ? "on" : ""}" onclick="filtro='da_fare';disegna()">${tr("da_fare")}</button></div>`}
  <div class="lista">${lista.length ? lista.map(b => boxHtml(b, ico)).join("") : `<div class="vuota">${dati.box.length ? `<i class="fa-solid fa-circle-check" style="font-size:40px;color:var(--ok)"></i><br><br>${tr("tutto_fatto")}` : tr("nessun_box")}</div>`}</div>
  <button class="fab" onclick="apriScanner()"><i class="fa-solid fa-qrcode"></i> ${tr("scansiona")}</button>`;
  if(focusBox){ const el = document.querySelector(".box"); el?.classList.add("evid"); }
}
function boxHtml(b, ico){
  const num = `<div class="box-num"><div><small>${tr("box")}</small>${esc(b.numero ?? "")}</div></div>`;
  const sotto = [b.nome, b.zona].filter(Boolean).map(esc).join(" · ");
  if(b.manutenzione) return `<div class="box manut" id="b-${b.id}"><div class="box-h">${num}<div class="box-cav"><b><i class="fa-solid fa-wrench"></i> ${tr("manut")}</b><span>${sotto}</span></div></div></div>`;
  if(!b.cavallo) return `<div class="box" id="b-${b.id}"><div class="box-h">${num}<div class="box-cav"><b style="color:var(--muted)">${tr("vuoto")}</b><span>${sotto}</span></div></div></div>`;
  const st = b.stato && L().st[b.stato] ? `<div class="box-stato">${glifo(STATI_ICONA[b.stato])} ${esc(L().st[b.stato])}</div>` : "";
  const finito = ico.every(k => fattaIn(b, k));
  return `<div class="box${finito ? " finito" : ""}" id="b-${b.id}"><div class="box-h">${num}<div class="box-cav"><b>${esc(b.cavallo)}</b>${sotto ? `<span>${sotto}</span>` : ""}${st}</div>
    ${b.nota ? `<button class="nota-btn" onclick="apriNota('${b.id}')" aria-label="${tr("nota")}">N</button>` : ""}</div>
    <div class="icone">${ico.map(k => { const a = fattaIn(b, k), d = ICONE[k];
      return `<button class="ic${a ? " fatto" : ""}${inAttesa(b, k) ? " attesa" : ""}" style="--c:${d.c}" onclick="tocca('${b.id}','${k}')">
        <span class="g">${glifo(d.i)}</span><span class="n">${esc(L().att[k])}</span>${a ? `<span class="chi">${esc((a.da || "").split(" ")[0])} ${esc(a.ora || "")}</span>` : ""}</button>`; }).join("")}</div></div>`;
}

/* ---------- azioni ---------- */
function tocca(boxId, tipo){
  const b = dati.box.find(x => x.id === boxId); if(!b) return;
  const a = fattaIn(b, tipo);
  if(a){
    foglio(`<h3><span style="color:${ICONE[tipo].c}">${glifo(ICONE[tipo].i)}</span> ${esc(L().att[tipo])} · ${esc(b.cavallo)}</h3><p>${esc(tr("fatto_da", { n: a.da || "", o: a.ora || "" }))}</p>
      <p style="color:var(--testo);font-weight:600">${tr("togli_q")}</p><div class="azioni"><button onclick="chiudiFoglio()">${tr("no")}</button><button class="pri" onclick="chiudiFoglio();segna('${boxId}','${tipo}',false)">${tr("si_togli")}</button></div>`);
    return;
  }
  segna(boxId, tipo, true);
}
function segna(boxId, tipo, fatto){
  const b = dati.box.find(x => x.id === boxId); if(!b) return;
  if(navigator.vibrate) try{ navigator.vibrate(fatto ? 30 : [20, 40, 20]); } catch(e){}
  b.fatte = (b.fatte || []).filter(a => a.tipo !== tipo);
  const quando = new Date().toISOString();
  if(fatto) b.fatte.push({ tipo, ora: oraAdesso(), da: dati.groom });
  // una sola voce in coda per box+attività: vince l'ultimo tocco
  coda = coda.filter(x => !(x.box === boxId && x.tipo === tipo));
  coda.push({ box: boxId, tipo, fatto, quando });
  if(!DEMO){ scrivi(K_CODA, coda); scrivi(K_CACHE, dati); }
  disegna();
  svuotaCoda().then(() => disegna());
}
function apriNota(boxId){
  const b = dati.box.find(x => x.id === boxId);
  foglio(`<h3><span class="nota-btn" style="width:34px;height:34px;display:grid;place-items:center;font-size:16px">N</span> ${esc(b.cavallo)}</h3><div class="nota-testo">${esc(b.nota)}</div>
    <div class="azioni"><button class="ver" onclick="chiudiFoglio()">${tr("chiudi")}</button></div>`);
}
function foglio(html){ chiudiFoglio(); const v = document.createElement("div"); v.className = "velo"; v.onclick = e => { if(e.target === v) chiudiFoglio(); }; v.innerHTML = `<div class="foglio">${html}</div>`; document.body.appendChild(v); }
function chiudiFoglio(){ fermaCamera(); document.querySelectorAll(".velo").forEach(v => v.remove()); }
function apriLingue(){
  foglio(`<h3><i class="fa-solid fa-language"></i> ${tr("lingua")}</h3><div class="lingue">${Object.entries(LINGUE).map(([k, n]) =>
    `<button class="${S.lang === k ? "on" : ""}" onclick="scegliLingua('${k}')" dir="${k === "ar" ? "rtl" : "ltr"}"><span>${n}</span>${S.lang === k ? '<i class="fa-solid fa-check"></i>' : ""}</button>`).join("")}</div>`);
}
async function scegliLingua(k){
  S.lang = k; S.langScelta = true; if(!DEMO) scrivi(K_STATO, S); applicaLingua(); chiudiFoglio();
  if(dati && S.pin){ disegna(); if(!DEMO) rpc("groom_lingua", { p_token: S.t, p_pin: S.pin, p_lingua: k }).catch(() => {}); }
  else avvio();
}
function apriMenu(){
  foglio(`<h3><i class="fa-solid fa-user"></i> ${esc(dati?.groom || "")}</h3><p>${esc(dati?.centro || "")}</p>
    <div class="azioni"><button onclick="chiudiFoglio()">${tr("chiudi")}</button><button class="pri" onclick="chiediEsci()"><i class="fa-solid fa-right-from-bracket"></i> ${tr("esci")}</button></div>`);
}
function chiediEsci(){ foglio(`<h3>${tr("esci")}</h3><p>${tr("esci_q")}</p><div class="azioni"><button onclick="chiudiFoglio()">${tr("no")}</button><button class="pri" onclick="esciDavvero()">${tr("esci")}</button></div>`); }
function esciDavvero(silenzioso){ const lang = S.lang; S = { lang }; coda = []; dati = null; scrivi(K_STATO, S); scrivi(K_CODA, []); scrivi(K_CACHE, null); clearInterval(timerPoll); timerPoll = null; chiudiFoglio(); if(!silenzioso){ history.replaceState(null, "", "/groom"); schermoBenvenuto(); } }

/* ---------- scanner QR del box ---------- */
let stream = null, scanTimer = null, rilevatore = null;
function fermaCamera(){ clearInterval(scanTimer); scanTimer = null; if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
function caricaJsQR(){ return new Promise(ok => { if(window.jsQR) return ok(true); const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = () => ok(true); s.onerror = () => ok(false); document.head.appendChild(s); }); }
async function apriScanner(){
  foglio(`<h3><i class="fa-solid fa-qrcode"></i> ${tr("scansiona")}</h3><p>${tr("inquadra")}</p><div class="scan-wrap"><video id="scan-v" playsinline muted></video><div class="mirino"></div></div>
    <div class="azioni"><button onclick="chiudiFoglio()">${tr("chiudi")}</button></div>`);
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
    const v = document.getElementById("scan-v"); if(!v){ fermaCamera(); return; } v.srcObject = stream; await v.play();
    if("BarcodeDetector" in window){ try{ rilevatore = new BarcodeDetector({ formats:["qr_code"] }); } catch(e){ rilevatore = null; } }
    if(!rilevatore) await caricaJsQR();
    const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently:true });
    scanTimer = setInterval(async () => {
      if(!v.videoWidth) return;
      let testo = null;
      if(rilevatore){ try{ const r = await rilevatore.detect(v); testo = r[0]?.rawValue; } catch(e){} }
      else if(window.jsQR){ c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0); const r = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height); testo = r?.data; }
      if(testo) letto(testo);
    }, 250);
  } catch(e){ chiudiFoglio(); toast(tr("camera_no")); }
}
function letto(testo){
  let b = null, t = null;
  try{ const u = new URL(testo, location.origin); b = u.searchParams.get("b"); t = u.searchParams.get("t"); } catch(e){}
  if(t && t !== S.t){ chiudiFoglio(); location.href = "/groom?t=" + encodeURIComponent(t); return; }
  if(!b) return;
  chiudiFoglio();
  if(!dati.box.some(x => x.id === b)){ toast(tr("box_no")); return; }
  focusBox = b; disegna(); scrollTo(0, 0);
}

/* ---------- installazione ---------- */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(dati) disegna(); });
async function installa(){ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; } catch(e){} installEvt = null; disegna(); }
window.addEventListener("appinstalled", () => { installEvt = null; if(dati) disegna(); });

/* ---------- demo (anteprima dal gestionale: /groom?demo=1) ---------- */
function demoRpc(nome, a){
  if(!window.__demo){
    const ora = (h, m) => String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    window.__demo = { groom:"Rahim", centro:"Centro Ippico Demo", oggi: oggiRoma(), icone_extra:["coperta"], box:[
      { id:"d1", numero:1, zona:"Scuderia A", cavallo:"Athos", stato:"in_box", nota:"Solo fieno bagnato, niente avena. Coperta leggera la notte.", fatte:[{ tipo:"pasto_mattina", ora:ora(7,10), da:"Rahim" }, { tipo:"acqua", ora:ora(7,12), da:"Rahim" }] },
      { id:"d2", numero:2, zona:"Scuderia A", cavallo:"Luna Blu", stato:"paddock", fatte:[{ tipo:"pasto_mattina", ora:ora(7,15), da:"Ion" }, { tipo:"paddock", ora:ora(9,0), da:"Ion" }] },
      { id:"d3", numero:3, zona:"Scuderia A", cavallo:"Zeus", stato:"in_box", nota:"Antibiotico alle 8 e alle 20.", fatte:[] },
      { id:"d4", numero:4, zona:"Scuderia B", cavallo:null, fatte:[] },
      { id:"d5", numero:5, zona:"Scuderia B", manutenzione:true, fatte:[] } ] };
  }
  if(nome === "groom_info") return { valido:true, nome:"Rahim", centro:"Centro Ippico Demo", lingua: S.lang, pin_da_creare:false };
  if(nome === "groom_stalla") return JSON.parse(JSON.stringify(window.__demo));
  if(nome === "groom_segna"){ const b = window.__demo.box.find(x => x.id === a.p_box); b.fatte = b.fatte.filter(x => x.tipo !== a.p_tipo); if(a.p_fatto) b.fatte.push({ tipo:a.p_tipo, ora:oraAdesso(), da:"Rahim" }); return { ok:true }; }
  return {};
}
if(DEMO){ S.nome = "Rahim"; rpc("groom_stalla", {}).then(ricevi); applicaLingua(); } else avvio();
</script>
<script>
/* ---------- EQUO OFFLINE (passaggio A): service worker unico (push + copia dell'app) ----------
   Lo stesso file delle notifiche: se OneSignal l'ha già registrato non si fa nulla, altrimenti lo registriamo noi. */
(function(){
  if(!("serviceWorker" in navigator) || location.protocol !== "https:") return;
  window.addEventListener("load", async () => {
    try{
      const reg = await navigator.serviceWorker.getRegistration("/");
      if(!reg) await navigator.serviceWorker.register("/OneSignalSDKWorker.js", { scope: "/" });
    } catch(e){ console.warn("service worker:", e); }
  });
})();

</script>
