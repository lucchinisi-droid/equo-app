<div class="modal-overlay" id="modal-remove-member" onclick="closeOut(event,'modal-remove-member')">
  <div class="modal">
    <div class="modal-title">Rimuovi membro <span class="x" onclick="closeModal('modal-remove-member')">✕</span></div>
    <p style="color:var(--muted);font-size:13.5px" id="remove-member-text">Confermi di voler rimuovere questo membro dal team?</p>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal('modal-remove-member')">Annulla</button>
      <button class="btn btn-danger" style="flex:1" onclick="confirmRemoveMember()">Rimuovi</button>
    </div>
  </div>
</div>

<!-- MODAL: modifica membro -->
