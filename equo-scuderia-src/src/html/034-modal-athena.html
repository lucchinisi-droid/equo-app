<div class="modal-overlay" id="modal-athena" onclick="closeOut(event,'modal-athena')">
  <div class="modal athena-modal">
    <div class="athena-top">
      <span class="athena-av" id="ag-av" style="background:url(assets/agenti/athena.webp) center/cover no-repeat;font-size:0"></span>
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:16px" id="ag-nome">Athena</div><div style="font-size:12px;color:var(--muted)" id="ag-sub">la tua segreteria AI · conosce tutto il gestionale</div></div>
      <button class="btn btn-ghost btn-sm" onclick="athenaNuovaChat()" title="Nuova chat"><i class="fa-solid fa-rotate-left"></i></button>
      <span class="x" style="cursor:pointer;color:var(--muted);font-size:16px;padding:4px" onclick="closeModal('modal-athena')">✕</span>
    </div>
    <div class="athena-box" id="athena-box"></div>
    <div class="athena-chips" id="athena-chips">
      <button data-proattiva onclick="athenaChiedi(this.textContent)">Cosa c'è da fare oggi?</button>
      <button onclick="athenaChiedi(this.textContent)">Come invito un nuovo allievo?</button>
      <button onclick="athenaChiedi(this.textContent)">Come creo un carnet di lezioni?</button>
      <button onclick="athenaChiedi(this.textContent)">Come collego un maniscalco?</button>
      <button onclick="athenaChiedi(this.textContent)">Cosa posso fare con il gestionale?</button>
    </div>
    <div class="athena-input">
      <textarea id="athena-input" rows="1" maxlength="4000" placeholder="Chiedi ad Athena come si fa qualcosa…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();athenaInvia()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="btn btn-primary" id="athena-send" onmousedown="event.preventDefault()" onclick="athenaInvia()" aria-label="Invia"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <div class="athena-uso" id="athena-uso"></div>
  </div>
</div>

<!-- MODAL: pannello del box -->
