<div class="modal-overlay" id="modal-box-nota" onclick="closeOut(event,'modal-box-nota')">
  <div class="modal" style="max-width:440px">
    <div class="modal-title"><span id="box-nota-titolo">Nota</span> <span class="x" onclick="closeModal('modal-box-nota')">✕</span></div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">La nota segue il cavallo: se lo sposti di box, la ritrovi con lui.</p>
    <textarea class="input" id="box-nota-testo" rows="4" maxlength="300" placeholder="Es. zoppica dall'anteriore destro, solo fieno bagnato…"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-primary btn-conferma" style="flex:1" onclick="boxSalvaNota(false)">Salva nota</button>
      <button class="btn btn-outline btn-variazione" id="box-nota-elimina" onclick="boxSalvaNota(true)">Elimina nota</button></div>
  </div>
</div>
<!-- MODAL: icone del giorno -->
