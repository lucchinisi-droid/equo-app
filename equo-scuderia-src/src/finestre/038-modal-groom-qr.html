    <div class="modal-title"><span id="groom-qr-titolo">QR</span> <span class="x" onclick="closeModal('modal-groom-qr')">✕</span></div>

    <p style="font-size:13.5px;line-height:1.5;margin:0 0 12px;color:var(--muted)">Il groom inquadra questo QR con la fotocamera del telefono, sceglie il suo PIN e mette l'app nella schermata Home. Il QR è personale: non condividerlo con altri.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-primary" onclick="groomCondividi()"><i class="fa-brands fa-whatsapp"></i> Invia link</button>
      <button class="btn btn-outline" onclick="groomCopia()"><i class="fa-solid fa-copy"></i> Copia link</button>
      <button class="btn btn-outline" onclick="groomStampaQr()"><i class="fa-solid fa-print"></i> Stampa</button>

  </div>
