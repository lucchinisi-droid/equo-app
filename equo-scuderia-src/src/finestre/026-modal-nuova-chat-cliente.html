<div class="modal-overlay" id="modal-nuova-chat-cliente" onclick="closeOut(event,'modal-nuova-chat-cliente')">
  <div class="modal">
    <div class="modal-title">Nuova chat con un cliente <span class="x" onclick="closeModal('modal-nuova-chat-cliente')">✕</span></div>
    <div class="field">
      <label>Codice app proprietario</label>
      <input class="input" id="nuova-chat-codice" placeholder="Es. EQUOOWN3Q9NM" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')avviaNuovaChatCliente()">
      <p style="color:var(--muted);font-size:12px;margin-top:4px">Chiedi al proprietario il suo codice personale (lo trova nel menu profilo di Equo App). Se ha già inserito il suo cavallo, verrà collegato automaticamente.</p>
    </div>
    <div class="auth-error" id="nuova-chat-cliente-error"></div>
    <button class="btn btn-primary btn-block" id="nuova-chat-cliente-btn" onclick="avviaNuovaChatCliente()">Collega e apri chat</button>
  </div>
</div>
