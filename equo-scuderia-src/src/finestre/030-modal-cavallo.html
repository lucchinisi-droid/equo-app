<div class="modal-overlay" id="modal-cavallo" onclick="closeOut(event,'modal-cavallo')">
  <div class="modal">
    <div class="modal-title"><span id="modal-cavallo-title">Nuovo cavallo</span><span class="x" onclick="closeModal('modal-cavallo')">✕</span></div>
    <div class="field"><label>Nome</label><input class="input" id="cav-nome" placeholder="Es. Ares"></div>
    <div class="field">
      <label>Categoria</label>
      <select class="input" id="cav-tipo-proprieta">
        <option value="proprieta">Cavallo di proprietà del centro ippico</option>
        <option value="pensione">Cavallo in pensione (privato)</option>
        <option value="soci">Cavallo di soci/istruttori</option>
      </select>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Razza</label><input class="input" id="cav-razza" placeholder="Scrivi per cercare, es. puros, maremm…"></div>
      <div class="field"><label>Mantello</label><input class="input" id="cav-mantello" placeholder="Es. Baio"></div>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Sesso</label><select class="input" id="cav-sesso"><option value="">Non indicato</option><option value="femmina">Femmina</option><option value="castrone">Castrone</option><option value="stallone">Stallone</option></select></div>
      <div class="field"><label>Attività</label><input class="input" id="cav-attivita" list="cav-attivita-elenco" maxlength="60" placeholder="Scegli o scrivi"></div>
    </div>
    <datalist id="cav-attivita-elenco"><option value="Salto ostacoli"><option value="Dressage"><option value="Completo"><option value="Endurance"><option value="Monta western"><option value="Monta da lavoro"><option value="Trotto"><option value="Galoppo"><option value="Volteggio"><option value="Attacchi"><option value="Polo"><option value="Scuola"><option value="Passeggiata / trekking"><option value="Riproduzione"><option value="A riposo"></datalist>
    <div class="grid grid-2">
      <div class="field"><label>Data di nascita</label><input class="input" id="cav-nascita" type="date"></div>
      <div class="field"><label>Microchip</label><input class="input" id="cav-microchip" placeholder="15 cifre"></div>
    </div>
    <div class="field"><label>Gruppo sanguigno</label><input class="input" id="cav-gruppo-sanguigno" placeholder="Facoltativo"></div>
    <div class="field"><label>Proprietario</label><input class="input" id="cav-proprietario" placeholder="Nome proprietario"></div>
    <div class="field">
      <label>Codice app proprietario <span style="color:var(--muted);font-weight:400">(facoltativo)</span></label>
      <input class="input" id="cav-codice-proprietario" placeholder="Es. EQUOOWN3Q9NM" style="text-transform:uppercase">
      <p style="color:var(--muted);font-size:12px;margin-top:4px">Se il proprietario ha Equo App, chiedigli il suo codice personale per collegarlo e poterci chattare direttamente.</p>
    </div>
    <div class="field">
      <label>Foto</label>
      <input class="input" id="cav-foto-file" type="file" accept="image/*">
      <div id="cav-foto-preview" style="margin-top:8px"></div>
    </div>
    <div class="field"><label>Note</label><input class="input" id="cav-note" placeholder="Facoltativo"></div>
    <div class="auth-error" id="cavallo-error"></div>
    <button class="btn btn-primary btn-block" id="cavallo-save-btn" onclick="saveCavallo()">Salva</button>
  </div>
</div>

<!-- MODAL: registra evento sanitario -->
