<div class="modal-overlay" id="modal-app-pro" onclick="closeOut(event,'modal-app-pro')">
  <div class="modal" style="max-width:560px;max-height:88vh;overflow-y:auto">
    <div class="modal-title"><span><i class="fa-solid fa-calendar-check" style="color:var(--muted);margin-right:6px"></i>Appuntamenti · <span id="app-pro-nome">Maniscalco</span></span> <span class="x" onclick="chiudiAppuntamentiPro()">✕</span></div>
    <div id="app-pro-lista-view">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <p style="margin:0;color:var(--muted);font-size:12.5px">Ogni appuntamento va confermato da entrambi: chi lo riceve conferma, propone un'altra data o annulla.</p>
        <button class="btn btn-primary btn-sm" style="flex-shrink:0" onclick="nuovoAppuntamentoPro()"><i class="fa-solid fa-plus"></i> Nuovo</button>
      </div>
      <div id="app-pro-lista"></div>
    </div>
    <div id="app-pro-form-view" style="display:none">
      <div style="font-weight:700;font-size:14px;margin-bottom:10px" id="app-pro-form-titolo">Nuovo appuntamento</div>
      <div id="app-pro-form-nuovo">
        <div class="field"><label>Tipo</label>
          <select class="input" id="app-pro-tipo" onchange="document.getElementById('app-pro-tipo-altro-wrap').style.display = this.value === 'altro' ? 'block' : 'none'">
            <option value="ferratura">Ferratura</option><option value="mezza_ferratura">Mezza ferratura</option>
            <option value="pareggio">Pareggio</option><option value="altro">Altro</option>
          </select></div>
        <div class="field" id="app-pro-tipo-altro-wrap" style="display:none"><label>Specifica</label><input class="input" id="app-pro-tipo-altro" maxlength="60" placeholder="Es. controllo zoccoli"></div>
        <div class="field"><label>Cavalli <span style="color:var(--muted);font-weight:400">(uno o più)</span></label>
          <div id="app-pro-cavalli" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px"></div></div>
      </div>
      <div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label>Data</label><input class="input" type="date" id="app-pro-data"></div>
        <div class="field" style="flex:1"><label>Ora</label><input class="input" type="time" id="app-pro-ora"></div>
      </div>
      <div class="field"><label>Note <span style="color:var(--muted);font-weight:400">(facoltative)</span></label><input class="input" id="app-pro-note" maxlength="300"></div>
      <div class="auth-error" id="app-pro-error"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" style="flex:1" onclick="mostraListaAppPro()">Indietro</button>
        <button class="btn btn-primary" style="flex:1" id="app-pro-salva" onclick="salvaAppuntamentoPro()">Invia al maniscalco</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: chat interna con un membro -->
