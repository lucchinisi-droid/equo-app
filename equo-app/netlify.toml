[build]
  functions = "netlify/functions"
  publish = "."
  # codice di build interno per il banner "Nuova versione disponibile" (non è la versione v1.0 mostrata)
  command = "node netlify/scrivi-build.js"

# PROVA del controllo automatico (tests/controllo-app.cjs) solo sul ramo "beta":
# se il controllo dei 4 ruoli fallisce, Netlify non pubblica. Quando la prova va bene
# lo stesso comando passa anche alla produzione.
[context.beta]
  command = "node netlify/scrivi-build.js && npm run controllo:netlify"

[functions]
  node_bundler = "esbuild"

# Annunci degli agenti: push degli annunci pubblicati con pubblica_annuncio() (SQL), ogni 15 minuti.
[functions."invia-annunci"]
  schedule = "*/15 * * * *"

# Pegasus: riepilogo settimanale il lunedì, ogni ora 6-9 UTC (8-11 in estate, 7-10 in inverno).
# Più giri = più utenti elaborati senza superare i 30 s delle funzioni programmate.
[functions."riepilogo-settimanale"]
  schedule = "0 6-9 * * 1"

# Hammer: riepilogo settimanale dei maniscalchi, stesse ore del lunedì.
[functions."riepilogo-hammer"]
  schedule = "0 6-9 * * 1"

# Merlino: radar della concorrenza per i centri PREMIUM, il lunedì alle 7 UTC (8-9 in Italia).
[functions."radar-merlino-settimanale"]
  schedule = "0 7 * * 1"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, stripe-signature"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/OneSignalSDKUpdaterWorker.js"
  [headers.values]
    Cache-Control = "no-cache"

# Pagine pubbliche (26/10/2026): scheda del cavallo dal QR della Equo Card e pagina del professionista (Equo CV, Premium)
[[redirects]]
  from = "/cavallo/*"
  to = "/.netlify/functions/pubblico?tipo=cavallo&c=:splat"
  status = 200

[[redirects]]
  from = "/pro/*"
  to = "/.netlify/functions/pubblico?tipo=pro&c=:splat"
  status = 200
